# Publishes to npm via Trusted Publisher (OIDC) — no NPM_TOKEN.
# Runs when a version tag is pushed (e.g. 2.1.2 or v2.1.2). Configure workflow filename + repo on npmjs.com → Trusted publishing.
# Requires Node ≥ 22.14 and npm ≥ 11.5.1 (https://docs.npmjs.com/trusted-publishers).
# Provenance is generated automatically when publishing from a public repo via trusted publishing.
name: Publish npm

on:
  push:
    tags:
      - 'v*'
      # Bare semver tags (e.g. 2.1.2) — three dot-separated segments
      - '*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm run build

      - run: npm publish --provenance --access public
